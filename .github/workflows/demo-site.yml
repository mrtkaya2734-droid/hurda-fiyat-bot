name: Demo sitesi (GitHub Pages)

# Uygulamayı bir kez çalıştırıp fiyatları çeker, sonucu statik dosyalara döker
# ve GitHub Pages'e yayınlar. Sunucu gerekmez; yaklaşık 5 dakikada bir yenilenir
# (GitHub zamanlayıcısının en sık değeri budur, gecikebilir).
#
# Tek seferlik kurulum: Depo > Settings > Pages > Source: "GitHub Actions".

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - "scripts/**"
      - ".github/workflows/demo-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: v2/requirements.txt

      - name: Bağımlılıkları kur
        run: |
          pip install -r v2/requirements.txt
          pip install httpx2

      # Fiyat geçmişi ve LME geçmişi turlar arasında burada saklanır.
      - name: Veri önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/veri
          key: veri-${{ github.run_id }}
          restore-keys: veri-

      - name: Fiyatları çek ve siteyi üret
        env:
          DATA_FILE: ${{ runner.temp }}/veri/data.json
          STATIK_GUNCELLE: "1"
          STATIK_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/statik_site_olustur.py site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
